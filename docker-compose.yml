services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: anchack
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:10
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - -url=jdbc:mysql://mysql:3306/anchack?allowPublicKeyRetrieval=true&useSSL=false
      - -user=root
      - -password=${DB_ROOT_PASSWORD}
      - -locations=filesystem:/flyway/sql
      - migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql

  app:
    build: .
    depends_on:
      flyway:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      JDBC_URL: jdbc:mysql://mysql:3306/anchack?allowPublicKeyRetrieval=true&useSSL=false
      JDBC_USERNAME: root
      JDBC_PASSWORD: ${DB_ROOT_PASSWORD}

      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}

      MOLIT_API_SERVICE_KEY: ${MOLIT_API_SERVICE_KEY:-}
      MOLIT_API_NUM_OF_ROWS: ${MOLIT_API_NUM_OF_ROWS:-100}
      MOLIT_API_CONNECT_TIMEOUT_MS: ${MOLIT_API_CONNECT_TIMEOUT_MS:-5000}
      MOLIT_API_READ_TIMEOUT_MS: ${MOLIT_API_READ_TIMEOUT_MS:-30000}

      KAKAO_PLACE_REST_API_KEY: ${KAKAO_PLACE_REST_API_KEY:-}
      KAKAO_PLACE_RADIUS: ${KAKAO_PLACE_RADIUS:-7000}
      KAKAO_PLACE_PAGE_SIZE: ${KAKAO_PLACE_PAGE_SIZE:-15}
      KAKAO_PLACE_MAX_PAGE: ${KAKAO_PLACE_MAX_PAGE:-45}
      KAKAO_PLACE_CONNECT_TIMEOUT_MS: ${KAKAO_PLACE_CONNECT_TIMEOUT_MS:-5000}
      KAKAO_PLACE_READ_TIMEOUT_MS: ${KAKAO_PLACE_READ_TIMEOUT_MS:-30000}

      KAKAO_ROUTE_REST_API_KEY: ${KAKAO_ROUTE_REST_API_KEY:-}
      KAKAO_ROUTE_CONNECT_TIMEOUT_MS: ${KAKAO_ROUTE_CONNECT_TIMEOUT_MS:-5000}
      KAKAO_ROUTE_READ_TIMEOUT_MS: ${KAKAO_ROUTE_READ_TIMEOUT_MS:-5000}
      ROUTE_MODE: ${ROUTE_MODE:-kakao}

      RECOMMENDATION_REASON_MODE: ${RECOMMENDATION_REASON_MODE:-stub}
      OPENAI_PROXY_BASE_URL: ${OPENAI_PROXY_BASE_URL:-}
      OPENAI_PROXY_TOKEN: ${OPENAI_PROXY_TOKEN:-}
      OPENAI_PROXY_MODEL: ${OPENAI_PROXY_MODEL:-gpt-4o-mini}
      OPENAI_PROXY_MAX_TOKENS: ${OPENAI_PROXY_MAX_TOKENS:-200}
      OPENAI_PROXY_CONNECT_TIMEOUT_MS: ${OPENAI_PROXY_CONNECT_TIMEOUT_MS:-5000}
      OPENAI_PROXY_READ_TIMEOUT_MS: ${OPENAI_PROXY_READ_TIMEOUT_MS:-15000}

      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}

  # 부하테스트 관찰용 - 기본 `docker compose up`에는 안 뜨고
  # `docker compose --profile monitoring up -d`로만 띄운다.
  # (loadtest/README.md 참고)
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    profiles: ["monitoring"]
    # mysqld_exporter 0.20+는 DATA_SOURCE_NAME 환경변수를 안 읽고 .my.cnf 파일만 본다
    # (--config.my-cnf). 비밀번호를 git에 커밋되는 파일에 그대로 적을 수 없으니,
    # 컨테이너 시작 시 이 서비스의 DB_ROOT_PASSWORD 환경변수로 .my.cnf를 즉석에서 만든다.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '[client]\nuser=root\npassword=%s\nhost=mysql\nport=3306\n' "$$DB_ROOT_PASSWORD" > /tmp/.my.cnf
        exec /bin/mysqld_exporter --config.my-cnf=/tmp/.my.cnf
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "9104:9104"

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./loadtest/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - mysqld-exporter

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      # 로컬 부하테스트 전용 구성이라 로그인 없이 바로 보게 익명 admin 접근을 켠다 -
      # 원격/공유 환경에 그대로 쓰면 안 됨.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      # 패널/대시보드를 PNG로 내보내려면(Export as image) 렌더러가 필요한데, Grafana
      # 프로세스 안에 직접 설치하는 대신(무거운 헤드리스 Chromium 포함, 불안정) 공식
      # 권장대로 별도 컨테이너(grafana-renderer)를 붙여서 HTTP로 위임한다.
      GF_RENDERING_SERVER_URL: http://grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ${GRAFANA_RENDERER_TOKEN}
    volumes:
      - ./loadtest/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - grafana-renderer

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    profiles: ["monitoring"]
    environment:
      AUTH_TOKEN: ${GRAFANA_RENDERER_TOKEN}

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
