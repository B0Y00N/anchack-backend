services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: anchack
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:10
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - -url=jdbc:mysql://mysql:3306/anchack?allowPublicKeyRetrieval=true&useSSL=false
      - -user=root
      - -password=${DB_ROOT_PASSWORD}
      - -locations=filesystem:/flyway/sql
      - migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql

  app:
    build: .
    depends_on:
      flyway:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      JDBC_URL: jdbc:mysql://mysql:3306/anchack?allowPublicKeyRetrieval=true&useSSL=false
      JDBC_USERNAME: root
      JDBC_PASSWORD: ${DB_ROOT_PASSWORD}

      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}

      MOLIT_API_SERVICE_KEY: ${MOLIT_API_SERVICE_KEY:-}
      MOLIT_API_NUM_OF_ROWS: ${MOLIT_API_NUM_OF_ROWS:-100}
      MOLIT_API_CONNECT_TIMEOUT_MS: ${MOLIT_API_CONNECT_TIMEOUT_MS:-5000}
      MOLIT_API_READ_TIMEOUT_MS: ${MOLIT_API_READ_TIMEOUT_MS:-30000}

      KAKAO_PLACE_REST_API_KEY: ${KAKAO_PLACE_REST_API_KEY:-}
      KAKAO_PLACE_RADIUS: ${KAKAO_PLACE_RADIUS:-7000}
      KAKAO_PLACE_PAGE_SIZE: ${KAKAO_PLACE_PAGE_SIZE:-15}
      KAKAO_PLACE_MAX_PAGE: ${KAKAO_PLACE_MAX_PAGE:-45}
      KAKAO_PLACE_CONNECT_TIMEOUT_MS: ${KAKAO_PLACE_CONNECT_TIMEOUT_MS:-5000}
      KAKAO_PLACE_READ_TIMEOUT_MS: ${KAKAO_PLACE_READ_TIMEOUT_MS:-30000}

      KAKAO_ROUTE_REST_API_KEY: ${KAKAO_ROUTE_REST_API_KEY:-}
      KAKAO_ROUTE_CONNECT_TIMEOUT_MS: ${KAKAO_ROUTE_CONNECT_TIMEOUT_MS:-5000}
      KAKAO_ROUTE_READ_TIMEOUT_MS: ${KAKAO_ROUTE_READ_TIMEOUT_MS:-5000}
      ROUTE_MODE: ${ROUTE_MODE:-kakao}

      RECOMMENDATION_REASON_MODE: ${RECOMMENDATION_REASON_MODE:-stub}
      OPENAI_PROXY_BASE_URL: ${OPENAI_PROXY_BASE_URL:-}
      OPENAI_PROXY_TOKEN: ${OPENAI_PROXY_TOKEN:-}
      OPENAI_PROXY_MODEL: ${OPENAI_PROXY_MODEL:-gpt-4o-mini}
      OPENAI_PROXY_MAX_TOKENS: ${OPENAI_PROXY_MAX_TOKENS:-200}
      OPENAI_PROXY_CONNECT_TIMEOUT_MS: ${OPENAI_PROXY_CONNECT_TIMEOUT_MS:-5000}
      OPENAI_PROXY_READ_TIMEOUT_MS: ${OPENAI_PROXY_READ_TIMEOUT_MS:-15000}

      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}

volumes:
  mysql_data:
