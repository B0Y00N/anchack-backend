name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: anchack_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x ./gradlew

      - name: Flyway 마이그레이션 적용
        run: >
          ./gradlew flywayMigrate
          -Pflyway.url=jdbc:mysql://127.0.0.1:3306/anchack_test
          -Pflyway.user=root
          -Pflyway.password=root

      - name: 빌드 & 테스트
        run: ./gradlew test

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

  # 클라우드 배포는 현재 보류 상태이므로 자동 실행하지 않는다.
  # 배포를 재개할 때 아래 if 조건을 'push: main'으로 되돌리면 된다.
  deploy:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "배포는 현재 보류 상태입니다. 수동 트리거로만 실행됩니다."
