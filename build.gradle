buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.flywaydb:flyway-mysql:10.17.0'
        classpath 'com.mysql:mysql-connector-j:8.4.0'
    }
}

plugins {
    id 'java'
    id 'war'
    id 'org.flywaydb.flyway' version '10.17.0'
}

group = 'com.kbait'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    springVersion = '5.3.37'
    mybatisVersion = '3.5.16'
    mybatisSpringVersion = '2.1.2'
    jacksonVersion = '2.17.2'
    lombokVersion = '1.18.30'
    jjwtVersion = '0.12.6'
}

dependencies {
    // Spring Legacy
    implementation "org.springframework:spring-context:${springVersion}"
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation "org.springframework:spring-tx:${springVersion}"
    implementation "org.springframework:spring-aop:${springVersion}"

    // MyBatis
    implementation "org.mybatis:mybatis:${mybatisVersion}"
    implementation "org.mybatis:mybatis-spring:${mybatisSpringVersion}"

    // Database
    implementation 'com.zaxxer:HikariCP:5.1.0'
    runtimeOnly 'com.mysql:mysql-connector-j:8.4.0'

    // JSON
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    // Validation
    implementation 'javax.validation:validation-api:2.0.1.Final'
    implementation 'org.hibernate.validator:hibernate-validator:6.2.5.Final'
    implementation 'org.glassfish:javax.el:3.0.1-b12'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.13'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.6'

    // Tomcat이 Servlet 구현체를 제공하므로 WAR에는 포함하지 않음
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'

    // Lombok (컴파일 타임 코드 생성용 - 런타임/WAR에는 불필요)
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Test
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation "org.springframework:spring-test:${springVersion}"
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Flyway (DB 마이그레이션)
//    implementation "org.flywaydb:flyway-core:${flywayVersion}"
//    implementation "org.flywaydb:flyway-mysql:${flywayVersion}"
    implementation 'org.flywaydb:flyway-core:10.17.0'
    implementation 'org.flywaydb:flyway-mysql:10.17.0'

    // 카카오 API 응답(JSON) 파싱
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    // DB 커넥션 풀
    implementation 'org.apache.commons:commons-dbcp2:2.11.0'

    // JWT (JJWT)
//    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
//    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
//    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

war {
    archiveFileName = 'anchack-backend.war'
}
